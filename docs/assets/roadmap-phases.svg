  <rect x="1112" y="324" width="240" height="42" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="1126" y="350" font-size="12" font-weight="400" fill="#334155" text-anchor="start">有无 skill 对照评测</text>
  <rect x="1112" y="376" width="240" height="42" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="1126" y="402" font-size="12" font-weight="400" fill="#334155" text-anchor="start">skills/&lt;category&gt;/ 分类</text>
  <rect x="1112" y="428" width="240" height="42" rx="11" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="1126" y="454" font-size="12" font-weight="400" fill="#334155" text-anchor="start">外部贡献者自助上架</text>
  <rect x="56" y="566" width="1290" height="104" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="76" y="596" font-size="13.5" font-weight="650" fill="#0f172a" text-anchor="start">每阶段的验收标准</text>
  <text x="76" y="624" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">新增 skill 评分 ≥ 9.5；同一层 skill 的 description 相似度 &lt; 50%；前端已有 skill 不改一行就能与新 skill 共存；</text>
  <text x="76" y="646" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">每个新 skill 都带可执行的验收清单，并用「有无 skill 对照」跑一遍再发布。</text>
