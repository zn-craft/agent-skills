  <text x="76" y="624" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">New skills score ≥ 9.5; descriptions in the same layer stay under 50% similarity; existing frontend skills keep working unchanged;</text>
  <text x="76" y="646" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Every new skill ships an executable acceptance checklist and a with-vs-without run before release.</text>
