# Calls only the scripts that already exist in package.json; no new commands here
name: CI

on:
  # Every push to the main branch
  push:
    branches: [main] # change to the repository's actual main branch
  # Pull requests too, as the gate before a merge
  pull_request:

permissions:
  contents: read # read-only by default; a job that publishes raises it separately

concurrency:
  # Cancel the previous run when one branch is pushed several times
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI has no need for git hooks
  HUSKY: 0

jobs:
  static:
    # One job per kind of static check, so a failure names the kind at a glance
    name: ${{ matrix.script }}
    # The same Linux environment as local development
    runs-on: ubuntu-latest
    strategy:
      # A failure in one check does not cancel the others; see every problem at once
      fail-fast: false
      # One entry per package.json script; add a check here
      matrix:
        script: [lint, format:check, stylelint, typecheck]
    steps:
      # Fetch the code; the major version follows the official releases
      - uses: actions/checkout@v4
      # The pnpm version comes from packageManager in package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # The same Node version as local development
          node-version-file: .nvmrc
          # Cache the pnpm store, with a key that includes the lock file contents
          cache: pnpm
      # Strict lock-file install: a mismatch between lock file and package.json fails here
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ${{ matrix.script }}

  test:
    # Add the coverage threshold arguments here when the project has them
    runs-on: ubuntu-latest
    steps:
      # Same preparation as the static job: fetch, install pnpm, pick Node from
      # .nvmrc, install from the lock file
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  build:
    # Append an artifact upload or deployment step when the output is archived
    runs-on: ubuntu-latest
    steps:
      # Same preparation as the static job
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
